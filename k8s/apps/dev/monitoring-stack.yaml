apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repo_url: https://github.com/venndev20999/homelabs-infrastructure.git
    target_revision: ft/dev
    path: k8s/manifests/monitoring # Path to your monitoring helm/kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
