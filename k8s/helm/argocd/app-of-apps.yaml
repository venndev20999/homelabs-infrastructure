---
# App-of-Apps: bootstraps all ArgoCD Applications in one kubectl apply
# Usage: kubectl apply -f argocd/app-of-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finance-stock-apps
  namespace: argocd
  # Cascade delete: removing this app removes all child apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finance-stock

  source:
    repoURL: https://github.com/your-org/finance-stock.git
    targetRevision: main
    path: infrastructure/k8s/helm/argocd/apps   # ArgoCD watches this folder

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
