---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: market-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: finance-stock
    tier: backend
spec:
  project: finance-stock

  sources:
    # Source 1: the Helm chart
    - repoURL: https://github.com/your-org/finance-stock.git
      targetRevision: main
      path: infrastructure/k8s/helm/apps/market-api
      helm:
        releaseName: market-api
        # Source 2 (values): env-specific overrides
        valueFiles:
          - $values/infrastructure/k8s/helm/environments/prod/market-api.yaml

    # Source 2 alias for valueFiles reference
    - repoURL: https://github.com/your-org/finance-stock.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: finance-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # Rollback on failure
  revisionHistoryLimit: 5
