# environments/prod/web-dashboard.yaml
replicaCount: 3

image:
  tag: "1.2.0"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8

ingress:
  enabled: true
  className: "nginx"
  host: "dashboard.finance.yourdomain.com"
  tls:
    - secretName: web-dashboard-tls
      hosts:
        - dashboard.finance.yourdomain.com

env:
  NEXT_PUBLIC_API_URL: "https://api.finance.yourdomain.com"
  NODE_ENV: "production"
