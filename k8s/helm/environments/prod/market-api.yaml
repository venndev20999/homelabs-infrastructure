# environments/prod/market-api.yaml
# Production overrides — merged on top of helm/apps/market-api/values.yaml

replicaCount: 3

image:
  tag: "1.2.0"   # pin exact version in prod, never "latest"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "api.finance.yourdomain.com"
  tls:
    - secretName: market-api-tls
      hosts:
        - api.finance.yourdomain.com

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-prod:9092"
  LOG_LEVEL: "warning"
