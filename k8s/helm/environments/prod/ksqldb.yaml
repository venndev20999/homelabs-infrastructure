# environments/prod/ksqldb.yaml
replicaCount: 2   # HA pair

image:
  tag: "0.29.0"

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

persistence:
  enabled: true
  storageClass: "fast-ssd"
  size: 50Gi

env:
  KSQL_BOOTSTRAP_SERVERS: "kafka-prod:9092"
  KSQL_HEAP_OPTS: "-Xms2g -Xmx6g"
