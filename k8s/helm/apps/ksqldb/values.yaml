# Default values for ksqlDB
replicaCount: 1

image:
  repository: confluentinc/ksqldb-server
  tag: "0.29.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8088

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

env:
  KSQL_LISTENERS: "http://0.0.0.0:8088"
  KSQL_BOOTSTRAP_SERVERS: "kafka:9092"
  KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
  KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
  KSQL_KSQL_SCHEMA_REGISTRY_URL: ""
  KSQL_KSQL_QUERIES_FILE: ""             # mount a ConfigMap here for pre-built queries

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi

livenessProbe:
  httpGet:
    path: /healthcheck
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /info
    port: 8088
  initialDelaySeconds: 15
  periodSeconds: 15
