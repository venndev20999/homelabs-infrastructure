---
# vars/talos.yml
# Define all Talos cluster nodes here.
# IPs must be in the libvirt default network range (192.168.122.1x)
# and must not conflict with existing instances.

talos_cluster_name: "finance-k8s-tst"
talos_prefix: "tst"

talos_iso_path: "/var/iso/metal-amd64.iso"
talos_disk_dir: "/var/lib/libvirt/images"
# talos_network:  "application-vpc"
talos_network:  "default"


# ── Control plane nodes ───────────────────────────────────────────────────────
# memory in MB, vcpus count
talos_masters:
  - name: "tl-master-{{ talos_prefix }}"
    ip:   "192.168.122.120"
    memory: 4096
    vcpus:  4
    disk_size: 40   # GB

# ── Worker nodes ──────────────────────────────────────────────────────────────
talos_workers:
  - name: "tl-worker-1-{{ talos_prefix }}"
    ip:   "192.168.122.121"
    memory: 2048
    vcpus:  2
    disk_size: 30

  - name: "tl-worker-2-{{ talos_prefix }}"
    ip:   "192.168.122.122"
    memory: 2048
    vcpus:  2
    disk_size: 30
