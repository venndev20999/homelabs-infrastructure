# ## Configure 'ip' variable to bind kubernetes services on a
# ## different ip than the default iface
# ## We should set etcd_member_name for etcd cluster. The node that is not a etcd member do not need to set the value, or can set the empty string value.
### GROUP VARS ###
[all:vars]
ansible_connection=ssh
ansible_ssh_user=venn
ansible_ssh_port=22
ansible_ssh_private_key_file=/Users/vennpham/.ssh/local
product=bucbumini
ansible_become_method=sudo
ansible_become=true

[all]
localserver ansible_host=192.168.1.189 ansible_ssh_user=vennpham ansible_ssh_private_key_file=/Users/vennpham/.ssh/local
haproxy ansible_host=192.168.1.11
docker-server ansible_host=192.168.122.155 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
elasticsearch01 ansible_host=192.168.122.89 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
kafka-1 ansible_host=192.168.122.221 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
kafka-2 ansible_host=192.168.122.222 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
kafka-3 ansible_host=192.168.122.223 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
postgres ansible_host=192.168.122.89 ansible_ssh_common_args='-o ProxyJump=haproxy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'


