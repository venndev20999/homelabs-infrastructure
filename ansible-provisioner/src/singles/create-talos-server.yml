---
# singles/create-talos-server.yml
# Provisions Talos KVM nodes directly via Ansible — no external scripts needed.
#
# Usage:
#   ansible-playbook -i inventory.ini singles/create-talos-server.yml
#   ansible-playbook -i inventory.ini singles/create-talos-server.yml -e talos_prefix=staging -e "talos_masters=[{name:'talos-vm-master-1-staging',ip:'192.168.122.120',memory:4096,vcpus:4,disk_size:50}]"

- name: "Provision Talos cluster nodes"
  hosts: talos
  gather_facts: no
  become: yes

  vars_files:
    - ../vars/talos-"{{talos_prefix}}".yml

  vars:
    # Combine masters + workers into one list for shared tasks
    all_nodes: "{{ talos_masters + talos_workers }}"

  tasks:

    # ── Preflight checks ───────────────────────────────────────────────────
    # - name: "[preflight] Check Talos ISO exists"
    #   stat:
    #     path: "{{ talos_iso_path }}"
    #   register: iso_stat

    # - name: "[preflight] Fail if ISO not found"
    #   fail:
    #     msg: >
    #       Talos ISO not found at {{ talos_iso_path }}.
    #       Upload it first: scp metal-amd64.iso localserver:{{ talos_iso_path }}
    #   when: not iso_stat.stat.exists

    - name: "[preflight] Check virt-install is available"
      command: which virt-install
      changed_when: false
      register: virt_check

    # ── Create VMs ─────────────────────────────────────────────────────────
    - name: "[vm] Check if VM already exists"
      command: virsh dominfo "{{ item.name }}"
      loop: "{{ all_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_exists
      ignore_errors: yes
      changed_when: false

    - name: "[vm] Create VM with virt-install"
      shell: |
        virt-install \
          --name "{{ item.item.name }}" \
          --memory {{ item.item.memory }} \
          --vcpus {{ item.item.vcpus }} \
          --disk path="{{ talos_disk_dir }}/{{ item.item.name }}.qcow2",size={{ item.item.disk_size }},format=qcow2 \
          --cdrom "{{ talos_iso_path }}" \
          --os-variant unknown \
          --network network="{{ talos_network }}",model=virtio \
          --graphics vnc,listen=0.0.0.0,port=-1 \
          --graphics spice \
          --video qxl \
          --console pty,target_type=serial \
          --noautoconsole
      loop: "{{ vm_exists.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc != 0   # only create if VM does NOT exist

    # ── Wait for network interface + get MAC ───────────────────────────────
    - name: "[net] Wait for network interface to appear (up to 60s)"
      shell: |
        for i in $(seq 1 30); do
          MAC=$(virsh domiflist "{{ item.name }}" 2>/dev/null | awk '/{{ talos_network }}/ {print $5}' | head -1)
          if [ -n "$MAC" ]; then
            echo "$MAC"
            exit 0
          fi
          sleep 2
        done
        echo "TIMEOUT"
        exit 1
      loop: "{{ all_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: mac_results
      changed_when: false

    - name: "[net] Fail if MAC not found for any node"
      fail:
        msg: "Could not get MAC address for {{ item.item.name }} — VM may not have started properly"
      loop: "{{ mac_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == "TIMEOUT" or item.rc != 0

    # ── Register static DHCP reservations ─────────────────────────────────
    - name: "[dhcp] Remove existing DHCP entry for MAC (if any)"
      shell: |
        MAC="{{ item.stdout }}"
        EXISTING=$(virsh net-dumpxml {{ talos_network }} | grep "mac='$MAC'" | sed "s/^\s*//")
        if [ -n "$EXISTING" ]; then
          virsh net-update {{ talos_network }} delete ip-dhcp-host \
            --xml "$EXISTING" --live --config
        fi
      loop: "{{ mac_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      ignore_errors: yes
      changed_when: false

    - name: "[dhcp] Register static IP → MAC reservation"
      command: >
        virsh net-update {{ talos_network }} add ip-dhcp-host
        --xml "<host mac='{{ item.0.stdout }}' name='{{ item.1.name }}' ip='{{ item.1.ip }}'/>"
        --live --config
      with_together:
        - "{{ mac_results.results }}"
        - "{{ all_nodes }}"
      loop_control:
        label: "{{ item.1.name }} → {{ item.1.ip }}"

    # ── Summary ────────────────────────────────────────────────────────────
    - name: "[summary] Cluster node allocation"
      debug:
        msg:
          - "============================================="
          - "Talos cluster: {{ talos_cluster_name }} [{{ talos_prefix }}]"
          - "============================================="
          - "MASTERS:"
          - "{% for r in mac_results.results[:talos_masters|length] %}  {{ r.item.name }}: IP={{ r.item.ip }}  MAC={{ r.stdout }}{% endfor %}"
          - "WORKERS:"
          - "{% for r in mac_results.results[talos_masters|length:] %}  {{ r.item.name }}: IP={{ r.item.ip }}  MAC={{ r.stdout }}{% endfor %}"
          - "============================================="
          - "Next step:"
          - "  talosctl apply-config --insecure --nodes {{ talos_masters[0].ip }} --file controlplane.yaml"
