---
# playbooks/create-talos-cluster.yml
# Provisions Talos K8s nodes directly via Ansible.

- name: "Provision Talos cluster nodes"
  hosts: talos
  gather_facts: no
  become: yes

  vars_files:
    - ../vars/talos-dev.yml

  vars:
    # Combine masters + workers into one list for shared tasks/checks
    all_nodes: "{{ (talos_masters | default([])) + (talos_workers | default([])) }}"

  tasks:
    - import_tasks: ./pre-check.yml
    - import_tasks: ../modules/talos-cluster/main.yml
