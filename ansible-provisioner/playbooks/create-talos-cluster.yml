---
# playbooks/create-talos-cluster.yml
# Provisions Talos K8s nodes directly via Ansible.
# Can be called with dynamic overrides for IPs, counts, and resource limits.

- name: "Provision Talos cluster nodes"
  hosts: talos
  gather_facts: no
  become: yes

  vars_files:
    # 1. Dynamically try to load environmental vars, then fall back to dev
    - ["../vars/talos-{{ talos_prefix | default('dev') }}.yml", "/dev/null"]
    - ["../vars/talos-dev.yml", "/dev/null"]

  vars:
    # ── CLI Overrides Helper ──────────────────────────────────────────────────
    
    # Safely convert master_ip by stripping everything except digits, dots, and commas.
    # Handles inputs like '192.168.1.1', '[192.168.1.1]', or '["192.168.1.1"]' reliably.
    _raw_master_ip: "{{ master_ip | default('') | string }}"
    _processed_master_ip: "{{ _raw_master_ip | regex_replace('[^0-9.,]', '') | split(',') | reject('==', '') | list }}"

    # Safely convert worker_ip using the same logic.
    _raw_worker_ip: "{{ worker_ip | default('') | string }}"
    _processed_worker_ip: "{{ _raw_worker_ip | regex_replace('[^0-9.,]', '') | split(',') | reject('==', '') | list }}"

    # Reconstruct master object from CLI params (force exactly 1 master)
    cli_masters_yaml: >-
      {% if _processed_master_ip | length > 0 %}
      - name: talos-vm-master-{{ talos_prefix }}
        ip: {{ _processed_master_ip[0] }}
        memory: {{ master_mem | default(4096) }}
        vcpus: {{ master_vcpus | default(4) }}
        disk_size: {{ master_disk_size | default(40) }}
      {% else %}
      []
      {% endif %}

    # Reconstruct worker objects from CLI params
    cli_workers_yaml: >-
      {% if _processed_worker_ip | length > 0 %}
      {% for ip in _processed_worker_ip %}
      - name: talos-vm-worker-{{ loop.index }}-{{ talos_prefix }}
        ip: {{ ip }}
        memory: {{ worker_mem | default(2048) }}
        vcpus: {{ worker_vcpus | default(2) }}
        disk_size: {{ worker_disk_size | default(30) }}
      {% endfor %}
      {% else %}
      []
      {% endif %}

    # Choose source of truth and explicitly parse the YAML string back into a dict
    final_masters: "{{ (cli_masters_yaml | from_yaml) if (master_ip is defined and _processed_master_ip | length > 0) else (talos_masters | default([])) }}"
    final_workers: "{{ (cli_workers_yaml | from_yaml) if (worker_ip is defined and _processed_worker_ip | length > 0) else (talos_workers | default([])) }}"
    
    # Combined for task loops
    all_nodes: "{{ (final_masters | default([])) + (final_workers | default([])) }}"

  tasks:
    - name: "[preflight] Print cluster distribution"
      debug:
        msg: 
          - "Prefix: {{ talos_prefix }}"
          - "Masters ({{ final_masters | length }}): {{ final_masters | map(attribute='ip') | list }}"
          - "Workers ({{ final_workers | length }}): {{ final_workers | map(attribute='ip') | list }}"

    - name: "[preflight] Override global vars for roles"
      set_fact:
        talos_masters: "{{ final_masters }}"
        talos_workers: "{{ final_workers }}"

    - import_tasks: ./pre-check.yml
    - import_tasks: ../modules/talos-cluster/main.yml
