---
# playbooks/pre-check.yml
# Pre-checks to ensure the environment is ready for Talos cluster provisioning.

- name: "Ping planned node IPs to check if they are already active"
  ansible.builtin.command: "ping -c 1 -W 1 {{ item.ip }}"
  loop: "{{ all_nodes }}"
  register: ping_check
  ignore_errors: yes
  changed_when: false

- name: "Halt if any IP address is already reachable"
  ansible.builtin.fail:
    msg: "The IP {{ item.item.ip }} (planned for {{ item.item.name }}) is already reachable. Please remove the existing node or change the IP configuration to avoid conflicts."
  loop: "{{ ping_check.results }}"
  when: item.rc == 0
