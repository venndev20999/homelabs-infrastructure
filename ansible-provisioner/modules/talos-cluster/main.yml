- name: "[preflight] Check virt-install is available"
  command: which virt-install
  changed_when: false
  register: virt_check

# ── Prepare Infrastructure ─────────────────────────────────────────────
- name: "[vm] Ensure ISO is in a path accessible by AppArmor/Libvirt"
  copy:
    src: "{{ talos_iso_path }}"
    dest: "/var/lib/libvirt/images/talos-metal.iso"
    remote_src: yes
    mode: '0664'
    owner: root
    group: root

- name: "[vm] Check if VMs already exist"
  command: virsh dominfo "{{ item.name }}"
  loop: "{{ all_nodes }}"
  register: vm_exists
  ignore_errors: yes
  changed_when: false

- name: "[vm] Create VM with virt-install"
  shell: |
    virt-install \
      --name "{{ item.item.name }}" \
      --memory {{ item.item.memory }} \
      --vcpus {{ item.item.vcpus }} \
      --disk path="{{ talos_disk_dir }}/{{ item.item.name }}.qcow2",size={{ item.item.disk_size }},format=qcow2 \
      --disk path="/var/lib/libvirt/images/talos-metal.iso",device=cdrom,readonly=on \
      --os-variant unknown \
      --network network="{{ talos_network }}",model=virtio \
      --graphics vnc,listen=0.0.0.0,port=-1 \
      --graphics spice \
      --video qxl \
      --console pty,target_type=serial \
      --boot cdrom,hd,menu=on \
      --noautoconsole
    # Stop immediately so the first boot happens AFTER the DHCP reservation is in place
    virsh destroy "{{ item.item.name }}" || true
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0   # only create if VM does NOT exist

# ── Prepare Network Reservations (Must happen BEFORE VM starts) ───────
- name: "[net] Retrieve MAC address for DHCP explicitly from XML"
  shell: |
    MAC=$(virsh dumpxml "{{ item.name }}" | grep "mac address=" | cut -d\' -f2 | head -1)
    if [ -n "$MAC" ]; then
      echo "$MAC"
    else
      exit 1
    fi
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: mac_results
  changed_when: false

- name: "[dhcp] Remove existing DHCP entries for Name, IP, or MAC (catch conflicts)"
  shell: |
    NET="{{ talos_network }}"
    NAME="{{ item.item.name }}"
    IP="{{ item.item.ip }}"
    MAC="{{ item.stdout }}"
    while true; do
      ENTRY=$(virsh net-dumpxml "$NET" | grep -E "name='$NAME'|ip='$IP'|mac='$MAC'" | sed "s/^\s*//" | head -1)
      if [ -n "$ENTRY" ]; then
        virsh net-update "$NET" delete ip-dhcp-host --xml "$ENTRY" --live --config || break
      else
        break
      fi
    done
  loop: "{{ mac_results.results }}"
  loop_control:
    label: "{{ item.item.name }} (MAC: {{ item.stdout }})"
  ignore_errors: yes
  changed_when: false

- name: "[dhcp] Register static IP → MAC reservation"
  command: >
    virsh net-update {{ talos_network }} add ip-dhcp-host
    --xml "<host mac='{{ item.0.stdout }}' name='{{ item.1.name }}' ip='{{ item.1.ip }}'/>"
    --live --config
  with_together:
    - "{{ mac_results.results }}"
    - "{{ all_nodes }}"
  loop_control:
    label: "{{ item.1.name }} → {{ item.1.ip }}"

# ── Finalize VM State ─────────────────────────────────────────────────
- name: "[vm] Fix disk image permissions for libvirt"
  file:
    path: "{{ talos_disk_dir }}/{{ item.name }}.qcow2"
    owner: libvirt-qemu
    group: kvm
    mode: '0660'
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[vm] Ensure VM is started (Now with DHCP reservation ready)"
  shell: |
    STATE=$(virsh domstate "{{ item.name }}")
    if [ "$STATE" != "running" ]; then
      virsh start "{{ item.name }}"
    fi
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# ── Summary ────────────────────────────────────────────────────────────
- name: "[summary] Cluster node allocation"
  debug:
    msg:
      - "============================================="
      - "Talos cluster: {{ talos_cluster_name }} [{{ talos_prefix }}]"
      - "============================================="
      - "MASTER (1):"
      - "  {{ mac_results.results[0].item.name }}: IP={{ mac_results.results[0].item.ip }}  MAC={{ mac_results.results[0].stdout }}"
      - "WORKERS:"
      - "{% for r in mac_results.results[1:] %}  {{ r.item.name }}: IP={{ r.item.ip }}  MAC={{ r.stdout }}{% endfor %}"
      - "============================================="
      - "Next step:"
      - "  talosctl apply-config --insecure --nodes {{ talos_masters[0].ip }} --file controlplane.yaml"
