- name: "[preflight] Check virt-install is available"
  command: which virt-install
  changed_when: false
  register: virt_check

# ── Create VMs ─────────────────────────────────────────────────────────
- name: "[vm] Check if VM already exists"
  command: virsh dominfo "{{ item.name }}"
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: vm_exists
  ignore_errors: yes
  changed_when: false

- name: "[vm] Create VM with virt-install"
  shell: |
    virt-install \
      --name "{{ item.item.name }}" \
      --memory {{ item.item.memory }} \
      --vcpus {{ item.item.vcpus }} \
      --disk path="{{ talos_disk_dir }}/{{ item.item.name }}.qcow2",size={{ item.item.disk_size }},format=qcow2 \
      --cdrom "{{ talos_iso_path }}" \
      --os-variant unknown \
      --network network="{{ talos_network }}",model=virtio \
      --graphics vnc,listen=0.0.0.0,port=-1 \
      --graphics spice \
      --video qxl \
      --console pty,target_type=serial \
      --noautoconsole
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0   # only create if VM does NOT exist

- name: "[vm] Ensure VM is started"
  shell: |
    STATE=$(virsh domstate "{{ item.name }}")
    if [ "$STATE" != "running" ]; then
      virsh start "{{ item.name }}"
    fi
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# ── Wait for network interface + get MAC ───────────────────────────────
- name: "[net] Retrieve MAC address for DHCP explicitly from XML"
  shell: |
    MAC=$(virsh dumpxml "{{ item.name }}" | grep "mac address=" | cut -d\' -f2 | head -1)
    if [ -n "$MAC" ]; then
      echo "$MAC"
    else
      exit 1
    fi
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: mac_results
  changed_when: false

- name: "[net] Fail if MAC not found for any node"
  fail:
    msg: "Could not get MAC address for {{ item.item.name }} — VM may not have started properly"
  loop: "{{ mac_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout == "TIMEOUT" or item.rc != 0

# ── Register static DHCP reservations ─────────────────────────────────
- name: "[dhcp] Reload libvirt network to flush stale DHCP state"
  shell: |
    virsh net-destroy {{ talos_network }}
    sleep 1
    virsh net-start {{ talos_network }}
  changed_when: true

- name: "[dhcp] Remove existing DHCP entry for MAC (if any)"
  shell: |
    MAC="{{ item.stdout }}"
    EXISTING=$(virsh net-dumpxml {{ talos_network }} | grep "mac='$MAC'" | sed "s/^\s*//")
    if [ -n "$EXISTING" ]; then
      virsh net-update {{ talos_network }} delete ip-dhcp-host \
        --xml "$EXISTING" --live --config
    fi
  loop: "{{ mac_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  ignore_errors: yes
  changed_when: false

- name: "[dhcp] Register static IP → MAC reservation"
  command: >
    virsh net-update {{ talos_network }} add ip-dhcp-host
    --xml "<host mac='{{ item.0.stdout }}' name='{{ item.1.name }}' ip='{{ item.1.ip }}'/>"
    --live --config
  with_together:
    - "{{ mac_results.results }}"
    - "{{ all_nodes }}"
  loop_control:
    label: "{{ item.1.name }} → {{ item.1.ip }}"

# ── Summary ────────────────────────────────────────────────────────────
- name: "[summary] Cluster node allocation"
  debug:
    msg:
      - "============================================="
      - "Talos cluster: {{ talos_cluster_name }} [{{ talos_prefix }}]"
      - "============================================="
      - "MASTER (1):"
      - "  {{ mac_results.results[0].item.name }}: IP={{ mac_results.results[0].item.ip }}  MAC={{ mac_results.results[0].stdout }}"
      - "WORKERS:"
      - "{% for r in mac_results.results[1:] %}  {{ r.item.name }}: IP={{ r.item.ip }}  MAC={{ r.stdout }}{% endfor %}"
      - "============================================="
      - "Next step:"
      - "  talosctl apply-config --insecure --nodes {{ talos_masters[0].ip }} --file controlplane.yaml"
