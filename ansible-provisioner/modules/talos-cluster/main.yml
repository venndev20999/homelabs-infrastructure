- name: "[preflight] Check virt-install is available"
  command: which virt-install
  changed_when: false
  register: virt_check

# ── Create VMs ─────────────────────────────────────────────────────────
- name: "[vm] Check if VM already exists"
  command: virsh dominfo "{{ item.name }}"
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: vm_exists
  ignore_errors: yes
  changed_when: false

- name: "[dhcp] Remove existing DHCP entries for Name, IP, or MAC (catch conflicts)"
  shell: |
    NET="{{ talos_network }}"
    NAME="{{ item.name }}"
    IP="{{ item.ip }}"
    MAC="52:54:00:12:34:{{ '%02x' | format(item.ip.split('.')[-1] | int) }}"
    while true; do
      ENTRY=$(virsh net-dumpxml "$NET" | grep -E "name='$NAME'|ip='$IP'|mac='$MAC'" | sed "s/^\s*//" | head -1)
      if [ -n "$ENTRY" ]; then
        if ! virsh net-update "$NET" delete ip-dhcp-host --xml "$ENTRY" --live --config; then
          virsh net-update "$NET" delete ip-dhcp-host --xml "$ENTRY" --live || true
          virsh net-update "$NET" delete ip-dhcp-host --xml "$ENTRY" --config || true
        fi
      else
        break
      fi
    done
  loop: "{{ all_nodes }}"
  loop_control:
    index_var: node_idx
    label: "{{ item.name }}"
  ignore_errors: yes
  changed_when: false
  when: vm_exists.results[node_idx].rc != 0  # only clean up if VM does not exist (being newly created)

- name: "[dhcp] Register static IP → MAC reservation"
  command: >
    virsh net-update {{ talos_network }} add ip-dhcp-host
    --xml "<host mac='52:54:00:12:34:{{ '%02x' | format(item.ip.split('.')[-1] | int) }}' name='{{ item.name }}' ip='{{ item.ip }}'/>"
    --live --config
  loop: "{{ all_nodes }}"
  loop_control:
    index_var: node_idx
    label: "{{ item.name }} → {{ item.ip }}"
  when: vm_exists.results[node_idx].rc != 0  # only add if VM does not exist (being newly created)

- name: "[vm] Create VM with virt-install"
  shell: |
    virt-install \
      --name "{{ item.item.name }}" \
      --memory {{ item.item.memory }} \
      --vcpus {{ item.item.vcpus }} \
      --disk path="{{ talos_disk_dir }}/{{ item.item.name }}.qcow2",size={{ item.item.disk_size }},format=qcow2 \
      --cdrom "{{ talos_iso_path }}" \
      --os-variant unknown \
      --network network="{{ talos_network }}",model=virtio,mac="52:54:00:12:34:{{ '%02x' | format(item.item.ip.split('.')[-1] | int) }}" \
      --graphics vnc,listen=0.0.0.0,port=-1 \
      --graphics spice \
      --video qxl \
      --console pty,target_type=serial \
      --boot hd,cdrom \
      --noautoconsole
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0   # only create if VM does NOT exist

- name: "[vm] Ensure VM is started"
  shell: |
    STATE=$(virsh domstate "{{ item.name }}")
    if [ "$STATE" != "running" ]; then
      virsh start "{{ item.name }}"
    fi
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# ── Summary ────────────────────────────────────────────────────────────
- name: "[summary] Cluster node allocation"
  debug:
    msg:
      - "============================================="
      - "Talos cluster: {{ talos_cluster_name }} [{{ talos_prefix }}]"
      - "============================================="
      - "MASTER (1):"
      - "  {{ talos_masters[0].name }}: IP={{ talos_masters[0].ip }}  MAC=52:54:00:12:34:{{ '%02x' | format(talos_masters[0].ip.split('.')[-1] | int) }}"
      - "WORKERS:"
      - "{% for w in talos_workers %}  {{ w.name }}: IP={{ w.ip }}  MAC=52:54:00:12:34:{{ '%02x' | format(w.ip.split('.')[-1] | int) }}{% endfor %}"
      - "============================================="
      - "Next step:"
      - "  talosctl apply-config --insecure --nodes {{ talos_masters[0].ip }} --file controlplane.yaml"
