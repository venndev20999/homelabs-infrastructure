---
# modules/alloy/main.yml
# Reusable module to install and configure Grafana Alloy on Linux hosts

- name: Ensure Grafana Loki and Prometheus local hostnames map to Envoy Gateway LoadBalancer IP
  lineinfile:
    path: /etc/hosts
    regexp: ".*{{ item }}$"
    line: "{{ gateway_ip | default('192.168.122.200') }}  {{ item }}"
    state: present
  loop:
    - loki.vennpham.local
    - prometheus.vennpham.local

- name: Ensure prerequisites are installed
  apt:
    name:
      - apt-transport-https
      - software-properties-common
      - curl
      - gpg
    state: present
    update_cache: true

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Grafana GPG key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.key
    mode: '0644'

- name: De-armor Grafana GPG key
  command: gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg /tmp/grafana.key
  args:
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana stable APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana Alloy
  apt:
    name: alloy
    state: present
    update_cache: true

- name: Configure Grafana Alloy (config.alloy)
  copy:
    dest: /etc/alloy/config.alloy
    mode: '0644'
    owner: alloy
    group: alloy
    content: |
      // ----------------------------------------------------
      // 1. Host Metrics Collection (Prometheus)
      // ----------------------------------------------------

      // Collect Linux host metrics (CPU, RAM, Disk, Net)
      prometheus.exporter.unix "host" {
        // Default collectors are enabled automatically
      }

      // Scrape node metrics
      prometheus.scrape "host" {
        targets    = prometheus.exporter.unix.host.targets
        forward_to = [prometheus.remote_write.local.receiver]
      }

      // Send metrics to Prometheus Server remote write endpoint
      prometheus.remote_write "local" {
        endpoint {
          url = "{{ prometheus_remote_write_url | default('http://prometheus.vennpham.local/api/v1/write') }}"
        }
      }

      // ----------------------------------------------------
      // 2. System Logs Collection (Loki)
      // ----------------------------------------------------

      // Match local log files to tail
      local.file_match "system_logs" {
        path_targets = [
          { __path__ = "/var/log/syslog" },
          { __path__ = "/var/log/auth.log" },
          { __path__ = "/var/log/**/*.log" },
        ]
      }

      // Attach hostname and job labels to logs
      loki.relabel "add_labels" {
        forward_to = [loki.write.local.receiver]

        rule {
          target_label = "instance"
          replacement  = "{{ inventory_hostname }}"
        }
        rule {
          target_label = "job"
          replacement  = "system-logs"
        }
      }

      // Tail log files and forward to processing component
      loki.source.file "system_logs" {
        targets    = local.file_match.system_logs.targets
        forward_to = [loki.process.logs_processing.receiver]
      }

      // Process log lines to extract and normalize log level
      loki.process "logs_processing" {
        forward_to = [loki.relabel.add_labels.receiver]

        // Extract level from common patterns (level=xxx or word boundaries like INF/ERR)
        stage.regex {
          expression = "(?:level=(?P<level1>[a-zA-Z]+)|\\b(?P<level2>INF|WRN|ERR|DBG)\\b)"
        }

         stage.template {
           source = "level"
           template = `{% raw %}{{- if .level1 -}}{{.level1}}
           {{- else if .level2 -}}
             {{- if eq .level2 "INF" -}}info
             {{- else if eq .level2 "WRN" -}}warning
             {{- else if eq .level2 "ERR" -}}error
             {{- else if eq .level2 "DBG" -}}debug
             {{- else -}}{{.level2}}
             {{- end -}}
           {{- else -}}info
           {{- end -}}{% endraw %}`
         }

        // Promote normalized level to a Loki label
        stage.labels {
          values = {
            level = "level",
          }
        }
      }

      // Send logs to Loki push endpoint
      loki.write "local" {
        endpoint {
          url = "{{ loki_push_url | default('http://loki.vennpham.local/loki/api/v1/push') }}"
        }
      }
  register: alloy_config_status

- name: Restart and enable Grafana Alloy service
  systemd:
    name: alloy
    state: restarted
    enabled: true
    daemon_reload: true
  when: alloy_config_status.changed
