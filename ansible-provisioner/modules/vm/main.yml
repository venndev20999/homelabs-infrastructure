---
# modules/vm/main.yml
# Tasks to provision general VMs on hypervisor safely and idempotently

- name: "[vm] Check if VM already exists"
  command: virsh dominfo "{{ item.name }}"
  loop: "{{ all_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  register: vm_exists
  ignore_errors: yes
  changed_when: false

- name: "[vm] Determine if any VM needs provisioning"
  set_fact:
    any_vm_cloned: "{{ vm_exists.results | selectattr('rc', 'ne', 0) | list | length > 0 }}"

- name: "[vm] Clone VM from base-server-ubuntu-24"
  shell: |
    virt-clone \
      --original base-server-ubuntu-24 \
      --name "{{ item.item.name }}" \
      --auto-clone
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0   # only clone if VM does NOT exist

- name: "[vm] Configure limits (CPU, RAM, Disk) and ensure running"
  shell: |
    # Dump XML configuration to /root (avoiding sticky-bit /tmp permission constraints)
    virsh dumpxml "{{ item.item.name }}" > "/root/{{ item.item.name }}.xml"
    
    # Use inline Python to update vCPUs, memory, currentMemory, and CPU topology cores simultaneously
    python3 -c "
    import xml.etree.ElementTree as ET
    tree = ET.parse('/root/{{ item.item.name }}.xml')
    root = tree.getroot()
    
    # Update vcpus
    vcpu = root.find('vcpu')
    if vcpu is not None:
        vcpu.text = '{{ item.item.vcpus }}'
        vcpu.set('placement', 'static')
        
    # Update memory (convert MB to KiB)
    mem = root.find('memory')
    if mem is not None:
        mem.text = str({{ item.item.memory }} * 1024)
    cur_mem = root.find('currentMemory')
    if cur_mem is not None:
        cur_mem.text = str({{ item.item.memory }} * 1024)
        
    # Update cpu topology to match vcpus (prevent libvirt mismatch errors)
    cpu = root.find('cpu')
    if cpu is not None:
        topo = cpu.find('topology')
        if topo is not None:
            topo.set('sockets', '1')
            topo.set('cores', '{{ item.item.vcpus }}')
            topo.set('threads', '1')
            if 'dies' in topo.attrib:
                topo.set('dies', '1')
                
    tree.write('/root/{{ item.item.name }}.xml')
    "
    
    # Define VM from the modified XML
    virsh define "/root/{{ item.item.name }}.xml"
    rm "/root/{{ item.item.name }}.xml"
    
    # Resize virtual disk image to target disk_size
    DISK_PATH=$(virsh domblklist "{{ item.item.name }}" | grep '/' | awk '{print $2}' | head -n 1)
    if [ -n "$DISK_PATH" ]; then
      qemu-img resize "$DISK_PATH" "{{ item.item.disk_size }}G"
    fi
    
    # Start VM
    STATE=$(virsh domstate "{{ item.item.name }}")
    if [ "$STATE" != "running" ]; then
      virsh start "{{ item.item.name }}"
    fi
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0   # only configure if VM is newly created

- name: "[net] Retrieve MAC address for DHCP explicitly from XML"
  shell: |
    MAC=$(virsh dumpxml "{{ item.item.name }}" | grep "mac address=" | cut -d\' -f2 | head -1)
    if [ -n "$MAC" ]; then
      echo "$MAC"
      exit 0
    else
      exit 1
    fi
  loop: "{{ vm_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: mac_results
  changed_when: false
  when: item.rc != 0   # only if VM is newly created

- name: "[dhcp] Reload libvirt network to flush stale DHCP state"
  shell: |
    virsh net-destroy {{ vm_network }}
    sleep 1
    virsh net-start {{ vm_network }}
  changed_when: true
  when: any_vm_cloned  # only reload network if new VM was provisioned

- name: "[dhcp] Remove existing DHCP entry for MAC (if any)"
  shell: |
    NAME="{{ item.item.item.name }}"
    IP="{{ item.item.item.ip }}"
    EXISTING=$(virsh net-dumpxml {{ vm_network }} | grep -E "name='$NAME'|ip='$IP'" | sed "s/^\s*//")
    if [ -n "$EXISTING" ]; then
      virsh net-update {{ vm_network }} delete ip-dhcp-host \
        --xml "$EXISTING" --live --config
    fi
  loop: "{{ mac_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  ignore_errors: yes
  changed_when: false
  when: any_vm_cloned

- name: "[dhcp] Register static IP → MAC reservation"
  command: >
    virsh net-update {{ vm_network }} add ip-dhcp-host
    --xml "<host mac='{{ item.0.stdout }}' name='{{ item.1.item.name }}' ip='{{ item.1.item.ip }}'/>"
    --live --config
  with_together:
    - "{{ mac_results.results | default([]) }}"
    - "{{ vm_exists.results | default([]) }}"
  loop_control:
    label: "{{ item.1.item.name }} → {{ item.1.item.ip }}"
  when: any_vm_cloned

- name: "[summary] VM allocation"
  debug:
    msg:
      - "============================================="
      - "Provisioned VMs via cloning [base-server-ubuntu-24]"
      - "============================================="
      - "{% for r in mac_results.results %}{% if not r.skipped | default(false) %}  {{ r.item.item.name }}: IP={{ r.item.item.ip }}  MAC={{ r.stdout }}{% endif %}{% endfor %}"
      - "============================================="
  when: any_vm_cloned
