version: "3.8"

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-test
    ports:
      - "9092:9092"
    environment:
      # Run in KRaft mode (no ZooKeeper required)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Keep replication factors at 1 for a single-node local setup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # --- RETENTION POLICIES ---

      # 1. Time-based: Delete after 1 day (24 hours)
      KAFKA_LOG_RETENTION_HOURS: 24

      # 2. Size-based: Delete after 100 MB (100 * 1024 * 1024 bytes)
      # Note: This limit applies PER PARTITION, not to the whole cluster.
      KAFKA_LOG_RETENTION_BYTES: 104857600

      # 3. Segment Size: Roll over to a new log file every 10 MB.
      # This forces Kafka to close files faster so the 100MB deletion rule can kick in.
      KAFKA_LOG_SEGMENT_BYTES: 10485760
